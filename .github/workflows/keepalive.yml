name: Keep Alive

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Push empty commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive (reset 60-day scheduled-workflow timer)"
          git push
 
